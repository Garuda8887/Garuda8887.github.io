<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garuda8887</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 640px;
            padding: 2rem;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.03em;
        }

        p {
            font-size: 1.125rem;
            font-weight: 400;
            color: #555555;
            margin: 0 0 2rem 0;
            line-height: 1.6;
        }

        .links {
            display: flex;
            gap: 1.5rem;
        }

        a {
            color: #111111;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(17, 17, 17, 0.2);
            padding-bottom: 2px;
            transition: border-color 0.2s ease;
        }

        a:hover {
            border-color: #111111;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Garuda8887</h1>
        <p>Personal website under construction.</p>
        <div class="links">
            <a href="https://github.com/Garuda8887" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </div>
</body>
